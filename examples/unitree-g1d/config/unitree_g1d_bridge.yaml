adapter_link:
  endpoint: "uds:/tmp/operator-g1d.sock"

bridge:
  name: "unitree-g1d"
  pose_port: 63901
  video_port: 12345
  discovery_port: 63900
  pose_udp_port: 63902
  telemetry_port: 63903
  video:
    feeds:
      - name: head_left
        command:
          - /home/unitree/miniconda3/envs/tv/bin/python
          - /home/unitree/operator/examples/unitree-g1d/scripts/teleimager_h264.py
          - --endpoint
          - tcp://127.0.0.1:55555
          - --eye
          - left
          - --fps
          - "30"
        tcp_port: 12345
        udp_port: 12345
        width: 640
        height: 480
        fps: 30
        transport: auto
        codec: h264
