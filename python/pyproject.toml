[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "operator-xr"
# maturin takes the version from the Cargo workspace (= /VERSION).
dynamic = ["version"]
description = "Python-first XR library for Operator"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering",
]
dependencies = [
    "rerun-sdk>=0.26.2",
]

[project.urls]
Repository = "https://github.com/lovemoon-ai/operator"

[project.optional-dependencies]
ik = ["numpy>=1.24"]
# Hosting the retargeting service. The solver library itself lives in the
# retargeting repository (`pip install ./python` there) and is imported lazily,
# so the rest of operator_xr works without it.
retargeting = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
]
test = [
  "numpy>=1.24",
  "pytest>=8",
  "pytest-cov>=5",
  "fastapi>=0.115",
  "httpx>=0.28",
]

[project.scripts]
operator = "operator_xr.cli:main"
# Shortcut for `operator serve --service retargeting`.
operator-retargeting = "operator_xr.services.retargeting:main"
operator-live-feed = "operator_xr.live_feed:main"

[tool.maturin]
manifest-path = "../robot/crates/pyoperator-native/Cargo.toml"
python-source = "."
module-name = "operator_xr._native"
bindings = "pyo3"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--cov=operator_xr",
  "--cov-branch",
  "--cov-report=term-missing",
]
markers = [
  "device: requires physical hardware and is skipped in normal host-only runs",
  "xr_device: requires a real Quest or Pico headset running Operator XR",
  "fake_headset: uses a host-side socket peer instead of a physical headset",
  "loopback: uses only host-local network resources",
]

[tool.coverage.run]
source = ["operator_xr"]
branch = true
# Only the depth-fusion reference server is omitted: its socket accept loop and
# fusion worker need a headset, and are covered by cicd/04_live_feed_e2e.sh.
# The reusable layers it is built from (protocol, models, decoders, runtime,
# results) are host-testable and are NOT omitted.
omit = ["operator_xr/live_feed/server.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
