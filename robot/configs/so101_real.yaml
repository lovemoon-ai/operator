# robot-adapter config - drives a real SO-101 arm over the Feetech serial bus.
#
# Run from the `robot/` directory:
#
#     cargo run -p robot-adapter -- --config configs/so101_real.yaml
#
# Required Python environment:
#
# - `lerobot` importable by the configured `python`
# - access to the Feetech serial port in `arm.so101.port`
#
# The adapter spawns `python scripts/so101_real_bridge.py bridge --port ...`.
# That Python bridge owns hardware calibration, conservative servo parameters,
# current/load reflexes, and one-step-per-frame setpoint limiting.

adapter_link:
  endpoint: "tcp:127.0.0.1:63910"

adapter:
  device_type: "so101_real"
  descriptor_file: "configs/so101_real_descriptor.yaml"

  arm:
    driver: "so101_real"
    serial_port: "/dev/serial/by-id/usb-1a86_USB_Single_Serial_58FA101992-if00"
    baudrate: 0

    # SO-101 has 6 actuators (5 arm joints + 1 gripper). servo_ids sizes the
    # PoseMapper output vector; the hardware bridge maps fixed Feetech IDs 1-6.
    servo_ids: [1, 2, 3, 4, 5, 6]

    so101:
      python: "/home/duino/code/github/lerobot/.venv/bin/python"
      script: "scripts/so101_real_bridge.py"
      port: "/dev/serial/by-id/usb-1a86_USB_Single_Serial_58FA101992-if00"
      extra_args: []

    safety:
      joint_limits_deg:
        - [-105.0,  105.0]    # shoulder_pan
        - [ -95.0,   95.0]    # shoulder_lift
        - [ -92.0,   92.0]    # elbow_flex
        - [ -90.0,   90.0]    # wrist_flex
        - [-150.0,  155.0]    # wrist_roll
        - [   0.0,  100.0]    # gripper normalized by LeRobot range mode
      max_velocity_deg_s: 90.0
      max_acceleration_deg_s2: 180.0

    pose_mapping:
      # Real hardware uses driver-side IK in the Python bridge. Controller-space
      # deltas become SO-101 base-frame end-effector target deltas, then MuJoCo
      # Jacobian IK solves the five arm joints before hardware step limiting.
      mode: "ik"
      scale: 0.5
      mirror: true

    # Serial bus round-trips plus reflex checks are slower than the sim.
    driver_write_timeout_ms: 250

bridge:
  name: "so101-real"
  pose_port: 63901
  video_port: 12345
  discovery_port: 63900
  pose_udp_port: 63902
  telemetry_port: 63903
