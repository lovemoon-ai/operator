# robot-service config - drives two real SO-101 arms from one XR session.
#
# THREE processes. `lerobot-teleoperate` drives exactly one follower, so a dual
# rig needs one plugin process per arm, each on its own endpoint:
#
#   Terminal 1 (from `robot/`):
#     cargo run -p robot-service -- --config configs/so101_dual_real.yaml
#
#   Terminal 2 (left arm):
#     lerobot-teleoperate \
#       --teleop.type=vr_operator \
#       --teleop.endpoint=uds:/tmp/lerobot-vr-left.sock \
#       --teleop.urdf_path=/path/to/so101_new_calib.urdf \
#       --robot.type=so101_follower \
#       --robot.id=left \
#       --robot.port=/dev/serial/by-id/LEFT_SO101_SERIAL \
#       --robot.max_relative_target=5
#
#   Terminal 3 (right arm): same, with
#       --teleop.endpoint=uds:/tmp/lerobot-vr-right.sock
#       --robot.id=right
#       --robot.port=/dev/serial/by-id/RIGHT_SO101_SERIAL
#
# Note `--robot.id` differs per arm: LeRobot keys its calibration file by id, so
# sharing one id across two physical arms would make them share calibration.
#
# robot-service's connect blocks until BOTH plugins say Hello.
#
# See configs/so101_real.yaml for the single-arm setup and the full rationale.

adapter_link:
  endpoint: "tcp:127.0.0.1:63910"

adapter:
  device_type: "so101_dual_real"
  descriptor_file: "configs/so101_dual_real_descriptor.yaml"

  dual_arm:
    left:
      driver: "lerobot_link"
      servo_ids: [1, 2, 3, 4, 5, 6]

      lerobot:
        endpoint: "uds:/tmp/lerobot-vr-left.sock"
        hello_timeout_ms: 60000

      safety:
        joint_limits_deg:
          - [-105.0,  105.0]    # shoulder_pan
          - [ -95.0,   95.0]    # shoulder_lift
          - [ -92.0,   92.0]    # elbow_flex
          - [ -90.0,   90.0]    # wrist_flex
          - [-150.0,  155.0]    # wrist_roll
          - [   0.0,  100.0]    # gripper - RANGE_0_100, not degrees
        max_velocity_deg_s: 90.0
        max_acceleration_deg_s2: 180.0

      pose_mapping:
        mode: "ik"
        scale: 0.5
        mirror: false

      driver_write_timeout_ms: 20

    right:
      driver: "lerobot_link"
      servo_ids: [1, 2, 3, 4, 5, 6]

      lerobot:
        endpoint: "uds:/tmp/lerobot-vr-right.sock"
        hello_timeout_ms: 60000

      safety:
        joint_limits_deg:
          - [-105.0,  105.0]    # shoulder_pan
          - [ -95.0,   95.0]    # shoulder_lift
          - [ -92.0,   92.0]    # elbow_flex
          - [ -90.0,   90.0]    # wrist_flex
          - [-150.0,  155.0]    # wrist_roll
          - [   0.0,  100.0]    # gripper - RANGE_0_100, not degrees
        max_velocity_deg_s: 90.0
        max_acceleration_deg_s2: 180.0

      pose_mapping:
        mode: "ik"
        scale: 0.5
        mirror: true

      driver_write_timeout_ms: 20

bridge:
  name: "so101-dual-real"
  pose_port: 63901
  video_port: 12345
  discovery_port: 63900
  pose_udp_port: 63902
  telemetry_port: 63903
