[workspace]
# New code lives under crates/. The legacy `robo-agent` package and its
# deprecated/ workspace member have been retired and removed.
members = [
    "crates/operator",
    "crates/operator-c",
    "crates/teleop-protocol",
    "crates/robot-adapter",
    "crates/xr-bridge",
    "crates/robot-service",
    "crates/e2e-tests",
    "crates/pyoperator-native",
]
resolver = "2"

# Every crate inherits this; it must equal /VERSION (scripts/version.py).
[workspace.package]
version = "0.2.0"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
