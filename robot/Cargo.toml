[workspace]
# New code lives under crates/. The legacy `robo-agent` package and its
# deprecated/ workspace member have been retired and removed.
members = [
    "crates/teleop-protocol",
    "crates/robot-adapter",
    "crates/xr-bridge",
    "crates/robot-service",
    "crates/e2e-tests",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
