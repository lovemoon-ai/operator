<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">Operator body tracking joint set comparison</title>
  <desc id="desc">Three T-pose human diagrams comparing Godot Humanoid, Pico body plus hand tracking, and Quest Meta full-body tracking joint sets.</desc>
