    <style>
      .bg { fill: #fafafa; }
      .panel { fill: #ffffff; stroke: #d8d8d8; stroke-width: 1.2; rx: 16; }
      .title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202124; }
      .subtitle { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6368; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6368; }
      .label { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3c4043; }
      .callout { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3c4043; }
      .skeleton { fill: none; stroke: #c5c8cc; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; opacity: 0.72; }
      .skeleton-thin { fill: none; stroke: #d7dade; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
      .joint { fill: currentColor; stroke: #ffffff; stroke-width: 2.3; }
      .joint-sm { r: 4.2; stroke-width: 1.6; }
      .joint-md { r: 6.2; }
      .joint-lg { r: 8.2; }
      .godot { color: #d93025; }
      .pico { color: #188038; }
      .quest { color: #1967d2; }
      .godot-soft { fill: #fce8e6; stroke: #fad2cf; }
      .pico-soft { fill: #e6f4ea; stroke: #ceead6; }
      .quest-soft { fill: #e8f0fe; stroke: #d2e3fc; }
      .dim { opacity: 0.28; }
      .link { stroke: currentColor; stroke-width: 2; opacity: 0.35; stroke-linecap: round; }
    </style>

