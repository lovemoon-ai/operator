  <rect class="bg" width="1800" height="980" />
  <text class="title" x="900" y="42" text-anchor="middle">Operator human-pose IR: raw vendor joints map into one canonical semantic view</text>
  <text class="subtitle" x="900" y="68" text-anchor="middle">Every dot is a joint slot or raw pose sample. Labels are selective to keep the full-body comparison readable.</text>

  <rect class="panel godot-soft" x="30" y="96" width="560" height="820" />
  <rect class="panel pico-soft" x="620" y="96" width="560" height="820" />
  <rect class="panel quest-soft" x="1210" y="96" width="560" height="820" />

  <g transform="translate(310 122)">
    <text class="title godot" x="0" y="0" text-anchor="middle" fill="currentColor">Godot Humanoid IR</text>
    <text class="subtitle" x="0" y="24" text-anchor="middle">XRBodyTracker, 87 canonical slots</text>
    <use href="#tpose-skeleton" transform="translate(0 62) scale(0.68 0.9)" />
    <use href="#godot-body-dots" transform="translate(0 62) scale(0.68 0.9)" />
    <text class="label" x="20" y="200">neck/head/head_tip</text>
    <text class="label" x="24" y="268">spine/chest/upper_chest</text>
    <text class="label" x="-160" y="166" text-anchor="middle">scapula + wrist_twist</text>
    <text class="label" x="160" y="166" text-anchor="middle">hands/fingers</text>
    <text class="label" x="0" y="842" text-anchor="middle">extra foot slots: toes, heel, middle_foot, foot_twist</text>
  </g>

  <g transform="translate(900 122)">
    <text class="title pico" x="0" y="0" text-anchor="middle" fill="currentColor">Pico</text>
    <text class="subtitle" x="0" y="24" text-anchor="middle">XR_BD body 24 + XR_EXT hands 52 = 76 raw poses</text>
    <use href="#tpose-skeleton" transform="translate(0 62) scale(0.68 0.9)" />
    <use href="#pico-body-dots" transform="translate(0 62) scale(0.68 0.9)" />
    <text class="label" x="20" y="204">head/neck</text>
    <text class="label" x="20" y="286">spine1/2/3</text>
    <text class="label" x="-160" y="166" text-anchor="middle">wrist + hand tracker</text>
    <text class="label" x="160" y="166" text-anchor="middle">no BD finger joints</text>
    <text class="label" x="0" y="842" text-anchor="middle">sparser lower body: hip, knee, ankle, foot</text>
  </g>

  <g transform="translate(1490 122)">
    <text class="title quest" x="0" y="0" text-anchor="middle" fill="currentColor">Quest / Meta</text>
    <text class="subtitle" x="0" y="24" text-anchor="middle">XR_META full-body 84; XR_FB 70 is the upper-body+hands subset</text>
    <use href="#tpose-skeleton" transform="translate(0 62) scale(0.68 0.9)" />
    <use href="#quest-body-dots" transform="translate(0 62) scale(0.68 0.9)" />
    <text class="label" x="20" y="204">head/neck/chest</text>
    <text class="label" x="-160" y="166" text-anchor="middle">scapula + wrist_twist</text>
    <text class="label" x="160" y="166" text-anchor="middle">hands/fingers</text>
    <text class="label" x="0" y="842" text-anchor="middle">full-body extension adds detailed ankle/foot chain</text>
  </g>

  <g transform="translate(58 930)">
    <circle class="joint joint-md godot" cx="0" cy="0" />
    <text class="callout" x="16" y="5">Red: Godot canonical Humanoid slots</text>
    <circle class="joint joint-md pico" cx="330" cy="0" />
    <text class="callout" x="346" y="5">Green: Pico body + standard hand tracking</text>
    <circle class="joint joint-md quest" cx="730" cy="0" />
    <text class="callout" x="746" y="5">Blue: Quest/Meta raw body definitions</text>
    <text class="small" x="1180" y="5">Raw sidecar keeps vendor-specific fields; canonical IR keeps source/source_joint provenance.</text>
  </g>
</svg>
