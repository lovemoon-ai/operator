[plugin]

name="SpatialMP4 Muxer"
description="Godot Android plugin that writes HEVC RGB + FFV1 lossless depth + timed-metadata pose / hand / controller tracks into a SpatialMP4 (.mp4) container via a patched FFmpeg. Pair with the XR Capture Provider plugin (which feeds it RGB packets / depth frames / pose) for full Quest 3 sessions, or call the SpatialMP4Writer GDScript wrapper directly to mux from another source."
author="SpatialMP4 Quest"
version="0.2.0"
script="export_plugin.gd"
