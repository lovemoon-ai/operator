[plugin]

name="Spatial Capture Contract"
description="Shared types + constants that the spatial capture provider and muxer plugins agree on (intrinsics dictionary shape, PTS domain, version). No native code, no Godot editor scripts -- the addon exists so consuming projects can `class_name SpatialCaptureContract` without depending on either plugin."
author="SpatialMP4 Quest"
version="0.1.0"
script="contract.gd"
