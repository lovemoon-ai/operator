[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "operator-collector"
version = "0.1.5"
description = "Cross-platform local workstation agent for Operator Quest data collection"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "LoveMoon" }]
dependencies = [
  "modelscope-hub==0.1.8",
]

[project.scripts]
operator-collector = "operator_collector.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
