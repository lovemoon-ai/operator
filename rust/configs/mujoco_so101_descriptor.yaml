descriptor_version: 2
execution:
  kind: "outside"
  environment: "simulation"

device:
  type: "robot_arm"
  name: "MuJoCo SO-101 Arm"
  icon: "robot_arm"
  model_url: ""

control_schema:
  axes:
    - name: "gripper"
      display: "Gripper"
      range: [0.0, 1.0]
      default: 1.0
      dead_zone: 0.02
  buttons:
    - name: "enable"
      display: "Enable"
      toggle: false
      confirm: false
    - name: "reset"
      display: "Reset"
      toggle: false
      confirm: false
  poses:
    - name: "end_effector"
      display: "End Effector Target"
      dof: 6
      frame: "right_hand"
    - name: "operator_frame"
      display: "Operator Alignment Frame"
      dof: 6
      frame: "head"

input_mapping:
  - source: "right_controller_pose"
    target: "end_effector"
    scale: 1.0
    invert: false
    offset: 0.0
    mode: "absolute"
  - source: "head_pose"
    target: "operator_frame"
    scale: 1.0
    invert: false
    offset: 0.0
    mode: "absolute"
  - source: "right_trigger"
    target: "gripper"
    scale: 1.0
    invert: true
    offset: 1.0
    mode: "absolute"
  - source: "right_grip"
    target: "enable"
    scale: 1.0
    invert: false
    offset: 0.0
    mode: "momentary"
  - source: "button_b"
    target: "reset"
    scale: 1.0
    invert: false
    offset: 0.0
    mode: "momentary"

telemetry_schema:
  values:
    - name: "joint_angles"
      display: "Joint Angles"
      unit: "deg"
      type: "array"
      length: 6
    - name: "num_joints"
      display: "Number of Joints"
      type: "int"
    - name: "connected"
      display: "Connected"
      type: "bool"

video_feeds: []

input_contract:
  rate_hz: 90.0
  coordinate_space: "operator_aligned_robot_frame"
  channels:
    - { name: "end_effector", type: "pose6d", frame: "right_hand" }
    - { name: "operator_frame", type: "pose6d", frame: "head" }
    - { name: "gripper", type: "axis", frame: "right_trigger" }
    - { name: "enable", type: "button", frame: "right_grip" }
    - { name: "reset", type: "button", frame: "button_b" }

capabilities:
  teleop: true
  emergency_stop: true
  reset: true
  video: false

safety:
  disconnect_action: "stop"
  command_timeout_ms: 500
  limits:
    gripper: [0.0, 1.0]
