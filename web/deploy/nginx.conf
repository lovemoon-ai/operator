# nginx site for operator.conductor-ai.top
#
# Reverse-proxies https://operator.conductor-ai.top → 127.0.0.1:6153
# (the operator-web systemd service). Coexists with conductor's main
# nginx site for `conductor-ai.top` — they're independent server blocks
# with disjoint server_name values, so reloads are non-disruptive.
#
# Install:
#   cp web/deploy/nginx.conf /etc/nginx/sites-available/operator
#   ln -sf /etc/nginx/sites-available/operator /etc/nginx/sites-enabled/operator
#   nginx -t && systemctl reload nginx
#
# Then, once DNS for operator.conductor-ai.top resolves to this box:
#   certbot --nginx -d operator.conductor-ai.top --non-interactive --agree-tos -m <email>
#
# certbot rewrites this file in-place to add `listen 443 ssl` + the
# `ssl_certificate*` lines; if you re-deploy this file, re-run certbot.

map $http_upgrade $operator_connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name operator.conductor-ai.top;

  # Before certbot runs, /.well-known/acme-challenge must reach the
  # webroot. After certbot installs HTTPS, this block becomes a pure
  # redirect to 443. Both states are handled by the same server block.
  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name operator.conductor-ai.top;

  # ssl_certificate lines are written by certbot. Until that runs, the
  # block above answers HTTP only — leave these commented so `nginx -t`
  # passes pre-certbot:
  # ssl_certificate     /etc/letsencrypt/live/operator.conductor-ai.top/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/operator.conductor-ai.top/privkey.pem;
  # include             /etc/letsencrypt/options-ssl-nginx.conf;
  # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  # TUS chunks can be very large (a 20-min spatial mp4 is ~10 GB). The
  # main conductor site caps at 20m; we need a much bigger ceiling.
  client_max_body_size 25g;
  client_body_buffer_size 1m;

  # Streaming for TUS PATCH + SSE: must NOT buffer the request or the
  # response, must keep the upstream socket open for long minutes.
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_http_version 1.1;
  proxy_read_timeout 30m;
  proxy_send_timeout 30m;

  # /api/ingest — TUS endpoint (PATCH with up to 25 GB body, OPTIONS,
  # HEAD for resume). Same upstream as everything else, just spelled
  # out explicitly so future tuning is local to this block.
  location /api/ingest {
    proxy_pass http://127.0.0.1:6153;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass_request_headers on;
  }

  # /api/ingest-read/events — Server-Sent Events stream. Disable
  # chunked encoding and any intermediate cache so events land in the
  # browser the moment they're emitted.
  location /api/ingest-read/events {
    proxy_pass http://127.0.0.1:6153;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    chunked_transfer_encoding off;
    add_header X-Accel-Buffering no;
  }

  # Next.js static assets — serve directly from nginx, skip the Node
  # round-trip. `alias` (not `root`) because the URL prefix differs
  # from the on-disk path tail.
  location /_next/static/ {
    alias /opt/conductor/operator/web/app/.next/static/;
    expires 1y;
    access_log off;
    add_header Cache-Control "public, immutable";
  }

  # Everything else → Next.js on :6153
  location / {
    proxy_pass http://127.0.0.1:6153;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $operator_connection_upgrade;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
  }
}
